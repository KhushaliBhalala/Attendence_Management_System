<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:head>
        <title>Attendance | Smart Attendance</title>
        <h:outputStylesheet name="css/faculty.css" />
    </h:head>

    <h:body>
        <h:form id="attendanceForm" enctype="multipart/form-data">
            <p:growl id="msgs" showDetail="true" />

            <p:panel header="Faculty Attendance Portal">
                <h:outputText value="Logged in as: #{AuthClient.currentUser.username}" style="font-weight:bold; color: #6750A4; display:block; margin-bottom:10px" />

                <h:panelGrid columns="4" cellpadding="10">
                    <p:outputLabel for="subject" value="Subject:" />
                    <p:selectOneMenu id="subject" value="#{facultyAttendanceClient.selectedSubject}" 
                                     required="true" styleClass="form-control-custom">
                        <f:selectItem itemLabel="-- Select Subject --" itemValue="0" noSelectionOption="true" />
                        <f:selectItems value="#{facultyAttendanceClient.allSubjects}" 
                                       var="s" 
                                       itemLabel="#{s.subjectName}" 
                                       itemValue="#{s.id}" />
                        <p:ajax listener="#{facultyAttendanceClient.loadStudents}" update="studentTable" />
                    </p:selectOneMenu>

                    <p:outputLabel for="division" value="Division:" />
                    <p:selectOneMenu id="division" value="#{facultyAttendanceClient.selectedDivision}" required="true">
                        <p:ajax listener="#{facultyAttendanceClient.loadStudents}" update="studentArea msgs" />
                        <f:selectItem itemLabel="-- Select Division --" itemValue="" />
                        <f:selectItems value="#{facultyAttendanceClient.allDivisions}" var="d" 
                                       itemLabel="#{d.divisionName}" itemValue="#{d.id}" />
                    </p:selectOneMenu>
                </h:panelGrid>
            </p:panel>

            <p:outputPanel id="studentArea" style="margin-top:20px">
                <p:panel header="Import Students" rendered="#{empty facultyAttendanceClient.students and facultyAttendanceClient.selectedDivision != 0}">
                    <p:fileUpload listener="#{facultyAttendanceClient.handleFileUpload}" 
                                  mode="advanced" update="studentArea msgs" auto="true" />
                </p:panel>

                <p:dataTable id="studentTable" value="#{facultyAttendanceClient.students}" var="stu" 
                             rendered="#{not empty facultyAttendanceClient.students}">
                    <p:column headerText="Enrollment No">#{stu.enrollmentNo}</p:column>
                    <p:column headerText="Student Name">#{stu.name}</p:column>
                    <p:column headerText="Attendance">
                        <p:selectOneButton value="#{stu.tempStatus}">
                            <f:selectItem itemLabel="Present" itemValue="P" />
                            <f:selectItem itemLabel="Absent" itemValue="A" />
                        </p:selectOneButton>
                    </p:column>
                </p:dataTable>

                <p:commandButton value="Save Attendance" action="#{facultyAttendanceClient.submit}" 
                                 rendered="#{not empty facultyAttendanceClient.students}" style="margin-top:15px" />
            </p:outputPanel>
        </h:form>
    </h:body>
</ui:composition>
