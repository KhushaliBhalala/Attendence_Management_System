<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Attendance System</title>
    </h:head>
    <h:body>
        <h:form id="attendanceForm" enctype="multipart/form-data">
            <p:growl id="messages" showDetail="true" />

            <p:panel header="Faculty Attendance Portal">
                <h:panelGrid columns="4" cellpadding="7">
                    <p:outputLabel for="subject" value="Subject: *" />
                    <p:selectOneMenu id="subject" value="#{facultyAttendanceClient.selectedSubject}">
                        <f:selectItem itemLabel="Select Subject" itemValue="0" />
                        <f:selectItems value="#{facultyAttendanceClient.allSubjects}" var="s" 
                                       itemLabel="#{s.subjectName}" itemValue="#{s.id}" />
                        <p:ajax listener="#{facultyAttendanceClient.loadStudents}" update="studentTable importPanel messages" />
                    </p:selectOneMenu>

                    <p:outputLabel for="division" value="Division: *" />
                    <p:selectOneMenu id="division" value="#{facultyAttendanceClient.selectedDivision}">
                        <f:selectItem itemLabel="Select Division" itemValue="0" />
                        <f:selectItems value="#{facultyAttendanceClient.allDivisions}" var="d" 
                                       itemLabel="#{d.divisionName}" itemValue="#{d.id}" />
                        <p:ajax listener="#{facultyAttendanceClient.loadStudents}" update="studentTable importPanel messages" />
                    </p:selectOneMenu>
                </h:panelGrid>

                <p:separator />

                <h:panelGroup id="importPanel">
                    <h:panelGroup rendered="#{empty facultyAttendanceClient.students and facultyAttendanceClient.selectedDivision != 0 and facultyAttendanceClient.selectedSubject != 0}">
                        <div style="padding: 20px; border: 1px dashed #ccc; text-align: center; margin-bottom: 20px;">
                            <h3 style="color: #666;">No students found in Database for this selection.</h3>
                            <p:fileUpload listener="#{facultyAttendanceClient.handleFileUpload}" 
                                          mode="advanced" 
                                          dragDropSupport="true"
                                          update="studentTable importPanel messages" 
                                          sizeLimit="1000000" 
                                          allowTypes="/(\.|\/)(xls|xlsx)$/" />
                        </div>
                    </h:panelGroup>
                </h:panelGroup>

                <p:dataTable id="studentTable" value="#{facultyAttendanceClient.students}" var="stu" 
                             emptyMessage="Please select Subject and Division first."
                             style="margin-top: 20px;">
                    <f:facet name="header">Student List for Attendance</f:facet>
                    <p:column headerText="Enrollment No">
                        <h:outputText value="#{stu.rollNo}" />
                    </p:column>
                    <p:column headerText="Name">
                        <h:outputText value="#{stu.name}" />
                    </p:column>
                    <p:column headerText="Attendance" style="text-align: center;">
                        <p:selectBooleanCheckbox value="#{stu.present}" />
                    </p:column>
                </p:dataTable>

                <f:facet name="footer">
                    <p:commandButton value="Submit Attendance" 
                                     action="#{facultyAttendanceClient.submitAttendance}"
                                     update="messages" 
                                     styleClass="ui-button-success" />
                </f:facet>
            </p:panel>
        </h:form>
    </h:body>
</html>
