<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"

    <h:head>
        <title>Faculty Dashboard | Smart Attendance</title>
        <h:outputStylesheet name="css/faculty.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    </h:head>

    <h:body>
        <div class="dashboard-wrapper">
            <div class="header-glass">
                <div class="user-info">
                    <h1>Welcome, Professor</h1>
                    <p>Manage your subjects, students, and attendance from one place.</p>
                </div>
            </div>

          <div class="content-grid">
    <p:link outcome="take_attendence" styleClass="action-card purple-shade">
        <div class="icon-box"><i class="fas fa-user-check"></i></div>
        <div class="card-text">
            <h3>Take Attendance</h3>
            <p>Mark presence for current lectures</p>
        </div>
    </p:link>
