<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Smart Attendance | Welcome</title>
    <style>
        body {
            background: linear-gradient(135deg, #F3E5F5 0%, #D1C4E9 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .wrapper {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(103, 80, 164, 0.15);
            text-align: center;
            width: 380px;
        }
        .brand-logo {
            background: #F3E5F5;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 15px;
            margin: 0 auto 1rem;
            font-size: 2rem;
        }
        .title { color: #21005D; font-weight: 700; margin-bottom: 5px; }
        .subtitle { color: #625B71; font-size: 0.9rem; margin-bottom: 2rem; }
        
        .btn-primary {
            width: 100%;
            background: #6750A4 !important;
            border: none !important;
            padding: 12px !important;
            border-radius: 100px !important;
            font-weight: 600 !important;
            margin-bottom: 15px !important;
        }
        .btn-outline {
            width: 100%;
            background: transparent !important;
            color: #6750A4 !important;
            border: 1.5px solid #6750A4 !important;
            padding: 12px !important;
            border-radius: 100px !important;
            font-weight: 600 !important;
        }
        .divider { margin: 20px 0; color: #CAC4D0; font-size: 0.8rem; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #EDF2F7; margin: 0 10px; }
    </style>
</h:head>
<h:body>
    <div class="wrapper">
        <div class="brand-logo">🎓</div>
        <h1 class="title">Smart Attendance</h1>
        <p class="subtitle">Efficient campus management via real-time tracking.</p>
        
        <h:form>
            <p:commandButton value="Login to Portal" action="login?faces-redirect=true" 
                             styleClass="btn-primary" icon="pi pi-sign-in" ajax="false"/>
            
<!--            <div class="divider">OR</div>
            
            <p:commandButton value="Create Student Account" action="register_student?faces-redirect=true" 
                             styleClass="btn-outline" icon="pi pi-user-plus" ajax="false"/>-->
        </h:form>
    </div>
</h:body>
</html>
