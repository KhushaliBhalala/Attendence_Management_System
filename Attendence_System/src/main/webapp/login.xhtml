<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Secure Access | Login</title>
    <style>
        body {
            background: linear-gradient(135deg, #F3E5F5 0%, #D1C4E9 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #ffffff;
            width: 380px;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(103, 80, 164, 0.15);
            text-align: center;
        }
        .brand-icon {
            background: #F3E5F5; width: 50px; height: 50px; line-height: 50px;
            border-radius: 12px; margin: 0 auto 1rem; color: #6750A4; font-size: 1.5rem;
        }
        .form-control {
            width: 100% !important; height: 48px !important; margin-bottom: 1.2rem !important;
            border-radius: 12px !important; border: 1.5px solid #CAC4D0 !important;
        }
        .btn-login {
            width: 100%; background: #6750A4 !important; border: none !important;
            padding: 14px !important; border-radius: 100px !important; color: #fff !important; font-weight: 600 !important;
        }
    </style>
</h:head>
<h:body>
    <div class="login-card">
        <div class="brand-icon"><i class="pi pi-shield"></i></div>
        <h2 style="color:#21005D; margin:0;">Portal Access</h2>
        <p style="color:#625B71; font-size:0.9rem; margin-bottom:2rem;">Attendance Management System</p>
        
        <h:form>
            <p:messages closable="true"><p:autoUpdate /></p:messages>
            
            <p:selectOneMenu value="#{AuthClient.roleId}" required="true" styleClass="form-control">
                <f:selectItem itemLabel="Select Your Role" itemValue="" noSelectionOption="true" />
                <f:selectItems value="#{AuthClient.roles}" var="r" itemLabel="#{r.roleName}" itemValue="#{r.id}" />
            </p:selectOneMenu>

            <p:inputText placeholder="Username" value="#{AuthClient.username}" required="true" styleClass="form-control" />
            
            <p:password placeholder="Password" value="#{AuthClient.password}" required="true" styleClass="form-control" />

            <p:commandButton value="Sign In to System" action="#{AuthClient.doLogin}" ajax="false" styleClass="btn-login" />
            
            <div style="margin-top:1.5rem;">
                <p:link outcome="index" style="color:#6750A4; text-decoration:none; font-size:0.85rem;">
                    <i class="pi pi-arrow-left"></i> Back to Welcome
                </p:link>
            </div>
        </h:form>
    </div>
</h:body>
</html>
