<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Faculty Management | Smart Attendance</title>
        <h:outputStylesheet name="css/dashboard.css" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

        <style>
            .modern-dialog.ui-dialog {
                border-radius: 15px;
                border: none;
            }
            .field-wrapper {
                margin-bottom: 20px;
            }
            .modern-label {
                font-weight: 600;
                margin-bottom: 8px;
                display: block;
                color: #444;
            }
            .input-with-icon {
                position: relative;
                display: flex;
                align-items: center;
            }
            .input-with-icon i {
                position: absolute;
                left: 15px;
                color: #a29bfe;
                z-index: 2;
            }
            .input-with-icon .ui-inputfield {
                padding-left: 40px !important;
                border-radius: 10px !important;
            }
            .modern-save-btn {
                background: #6c5ce7 !important;
                border: none !important;
                border-radius: 8px !important;
            }
            .dashboard-container {
                display: flex;
                min-height: 100vh;
            }
            .main-content {
                flex: 1;
                padding: 20px;
                background: #f8f9fc;
            }
        </style>
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" />

        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                    <span>Smart Attendance</span>
                </div>
                <nav class="menu">
                    <h:link outcome="admin_dashboard"><i class="fas fa-chart-line"></i> Dashboard</h:link>
                    <h:link outcome="manage_faculty" styleClass="active"><i class="fas fa-chalkboard-teacher"></i> Manage Faculty</h:link>
                    <h:link outcome="manage_subjects"><i class="fas fa-book"></i> Subjects</h:link>
                </nav>
            </aside>

            <main class="main-content">
                <header class="top-nav" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2>Faculty Management</h2>
                        <p style="color: #888;">Manage faculty members and their credentials</p>
                    </div>
                    <h:form>
                        <p:commandButton value="Add New Faculty" icon="pi pi-user-plus" 
                                         type="button" onclick="PF('addFacultyDlg').show();" 
                                         styleClass="ui-button-raised ui-button-help premium-btn" />
                    </h:form>
                </header>

                <div class="stat-card" style="background: white; padding: 30px; margin-top: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
                    <h:form id="facultyForm">
                        <p:dataTable id="dt-faculty" value="#{facultyClient.facultyList}" var="f" 
                                     paginator="true" rows="8" paginatorPosition="bottom">

                            <p:column headerText="Name">
                                <h:outputText value="#{f.name}" style="font-weight: 600;" />
                            </p:column>

                            <p:column headerText="Email">#{f.email}</p:column>

                            <p:column headerText="Subject">
                                <p:tag value="#{f.subjectId.subjectName}" severity="info" />
                            </p:column>

                            <p:column headerText="Username">
                                <code style="color: #6c5ce7;">#{f.userId.username}</code>
                            </p:column>

                            <p:column headerText="Actions">
                                <p:commandButton icon="pi pi-pencil" styleClass="ui-button-flat" />
                                <p:commandButton icon="pi pi-trash" action="#{facultyClient.delete(f.id)}" 
                                                 update="@form :growl" styleClass="ui-button-flat" style="color:red" />
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </div>
            </main>
        </div>

        <p:dialog header="Register New Faculty" widgetVar="addFacultyDlg" modal="true" 
                  resizable="false" draggable="false" responsive="true" styleClass="modern-dialog" width="450">
            <h:form id="addForm">
                <div class="ui-fluid">
                    <div class="field-wrapper">
                        <p:outputLabel value="Full Name" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <p:inputText value="#{facultyClient.faculty.name}" required="true" placeholder="John Doe" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Login Username" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-at"></i>
                            <p:inputText value="#{facultyClient.username}" required="true" placeholder="johndoe123" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Password" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <p:password value="#{facultyClient.password}" required="true" feedback="false" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Assign Subject" styleClass="modern-label" />
                        <p:selectOneMenu value="#{facultyClient.selectedSubjectId}" required="true">
                            <f:selectItem itemLabel="Select Subject" itemValue="" noSelectionOption="true" />
                            <f:selectItems value="#{subjectClient.subjectList}" var="s" 
                                           itemLabel="#{s.subjectName}" itemValue="#{s.id}" />
                        </p:selectOneMenu>                    </div>

                    <div style="text-align: right; margin-top: 20px;">
                        <p:commandButton value="Save Faculty" action="#{facultyClient.addFaculty()}" 
                                         update=":facultyForm:dt-faculty :growl @form" 
                                         oncomplete="if (!args.validationFailed) PF('addFacultyDlg').hide()" 
                                         styleClass="modern-save-btn" icon="pi pi-check" />
                    </div>
                </div>
            </h:form>
        </p:dialog>
    </h:body>
</html>
