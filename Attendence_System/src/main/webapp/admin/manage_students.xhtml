<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Student Management | Smart Attendance</title>
        <h:outputStylesheet name="css/dashboard.css" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

        <style>
            .modern-dialog.ui-dialog {
                border-radius: 15px;
                border: none;
            }
            .field-wrapper {
                margin-bottom: 20px;
            }
            .modern-label {
                font-weight: 600;
                margin-bottom: 8px;
                display: block;
                color: #444;
            }
            .input-with-icon {
                position: relative;
                display: flex;
                align-items: center;
            }
            .input-with-icon i {
                position: absolute;
                left: 15px;
                color: #a29bfe;
                z-index: 2;
            }
            .input-with-icon .ui-inputfield {
                padding-left: 40px !important;
                border-radius: 10px !important;
            }
            .modern-save-btn {
                background: #6c5ce7 !important;
                border: none !important;
                border-radius: 8px !important;
            }
            .dashboard-container {
                display: flex;
                min-height: 100vh;
            }
            .main-content {
                flex: 1;
                padding: 20px;
                background: #f8f9fc;
            }
            /* Flex layout for Sem and Div */
            .form-row {
                display: flex;
                gap: 15px;
            }
            .form-row > div {
                flex: 1;
            }
        </style>
    </h:head>

    <h:body>
        <p:growl id="growl" showDetail="true" />

        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                    <span>Smart Attendance</span>
                </div>
                <nav class="menu">
                    <h:link outcome="admin_dashboard.xhtml"><i class="fas fa-chart-line"></i> Dashboard</h:link>
                    <h:link outcome="manage_faculty.xhtml"><i class="fas fa-chalkboard-teacher"></i> Manage Faculty</h:link>
                    <h:link outcome="manage_students.xhtml" styleClass="active"><i class="fas fa-user-graduate"></i> Manage Students</h:link>
                    <h:link outcome="manage_subjects.xhtml"><i class="fas fa-book"></i> Subjects</h:link>
                    <h:link outcome="view_reports.xhtml"><i class="fas fa-file-invoice"></i> Attendance Reports</h:link>
                    <h:form>
                        <p:commandLink action="#{authBean.logout()}" styleClass="logout-btn">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </p:commandLink>
                    </h:form>
                </nav>
            </aside>

            <main class="main-content">
                <h:form id="mainForm">
                    <header class="top-nav" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h2>Student Management</h2>
                            <p style="color: #888;">Add, Edit or Remove students from the system</p>
                        </div>
                        <p:commandButton value="Add New Student" icon="pi pi-user-plus" 
                                         actionListener="#{studentClient.resetForm()}" 
                                         update=":addStudentForm"
                                         oncomplete="PF('studentDlg').show();" 
                                         styleClass="ui-button-raised ui-button-help premium-btn" />
                    </header>

                    <div class="stat-card" style="background: white; padding: 30px; margin-top: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
                        <p:dataTable id="dt-students" value="#{studentClient.studentList}" var="s" 
                                     paginator="true" rows="10" paginatorPosition="bottom">

                            <p:column headerText="Enroll No" style="width: 120px;">
                                <h:outputText value="#{s.rollNo}" style="font-weight: 600; color: #6c5ce7;" />
                            </p:column>

                            <p:column headerText="Student Name">
                                <h:outputText value="#{s.name}" />
                            </p:column>

                            <p:column headerText="Email">#{s.email}</p:column>

                            <p:column headerText="Mobile">
                                <h:outputText value="#{s.mobileNo}" />
                            </p:column>

                            <p:column headerText="Class/Sem">
                                <h:outputText value="#{s.divisionId != null ? s.divisionId.divisionName : 'N/A'} - Sem #{s.semesterId != null ? s.semesterId.semesterNo : 'N/A'}" />
                            </p:column>

                            <p:column headerText="Actions" style="width: 100px; text-align: center;">
                                <p:commandButton icon="pi pi-pencil" 
                                                 action="#{studentClient.prepareEdit(s)}" 
                                                 update=":addStudentForm" 
                                                 oncomplete="PF('studentDlg').show();"
                                                 styleClass="ui-button-flat" />

                                <p:commandButton icon="pi pi-trash" 
                                                 action="#{studentClient.delete(s.id)}" 
                                                 update=":mainForm:dt-students :growl" 
                                                 styleClass="ui-button-flat" 
                                                 style="color:red">
                                    <p:confirm header="Confirmation" message="Delete this student?" icon="pi pi-exclamation-triangle" />
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </div>
                </h:form>
            </main>
        </div>

        <p:dialog header="Student Details" widgetVar="studentDlg" modal="true" 
                  resizable="false" draggable="false" responsive="true" styleClass="modern-dialog" width="500">
            <h:form id="addStudentForm">
                <div class="ui-fluid">
                    <div class="field-wrapper">
                        <p:outputLabel value="Enrollment Number" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-id-card"></i>
                            <p:inputText value="#{studentClient.student.rollNo}" required="true" placeholder="ENR001" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Full Name" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <p:inputText value="#{studentClient.student.name}" required="true" placeholder="Rahul Patel" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Email Address" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <p:inputText value="#{studentClient.student.email}" required="true" placeholder="rahul@gmail.com" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Mobile Number" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-phone"></i>
                            <p:inputText value="#{studentClient.student.mobileNo}" required="true" placeholder="9998887776" />
                        </div>
                    </div>

                    <div class="field-wrapper">
                        <p:outputLabel value="Login Password" styleClass="modern-label" />
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <p:password value="#{studentClient.student.password}" required="true" placeholder="******" feedback="false" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="field-wrapper">
                            <p:outputLabel value="Semester" styleClass="modern-label" />
                            <p:selectOneMenu value="#{studentClient.selectedSemId}" required="true">
                                <f:selectItem itemLabel="Select Sem" itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{semesterClient.semesterList}" var="sem" 
                                               itemLabel="#{sem.semesterNo}" itemValue="#{sem.id}" /> 
                            </p:selectOneMenu>
                        </div>

                        <div class="field-wrapper">
                            <p:outputLabel value="Division" styleClass="modern-label" />
                            <p:selectOneMenu value="#{studentClient.selectedDivId}" required="true">
                                <f:selectItem itemLabel="Select Division" itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{divisionClient.divisionList}" var="d" 
                                               itemLabel="#{d.divisionName}" itemValue="#{d.id}" />
                            </p:selectOneMenu>
                        </div>
                    </div>

                    <div style="text-align: right; margin-top: 20px;">
                        <p:commandButton value="Save Student" 
                                         action="#{studentClient.save()}" 
                                         update=":mainForm:dt-students :growl @form" 
                                         oncomplete="if (!args.validationFailed) PF('studentDlg').hide()" 
                                         styleClass="modern-save-btn" 
                                         icon="pi pi-check" /> 
                    </div>
                </div>
            </h:form>
        </p:dialog>

        <h:form id="confirmForm">
            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" />
            </p:confirmDialog>
        </h:form>
    </h:body>
</html>
