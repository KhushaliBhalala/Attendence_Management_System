<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Manage Subjects | Smart Attendance</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet" />
        <h:outputStylesheet name="css/dashboard.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
        
        <style>
            .modern-dialog.ui-dialog { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
            .modern-dialog .ui-dialog-titlebar { background: transparent; border: none; padding: 20px; font-family: 'Poppins'; }
            .dialog-icon-circle { width: 50px; height: 50px; background: #f3f0ff; color: #6c5ce7; border-radius: 50%; 
                                  display: flex; align-items: center; justify-content: center; margin: 0 auto; font-size: 1.5rem; }
            .field-wrapper { margin-bottom: 20px; text-align: left; }
            .modern-label { font-weight: 600; margin-bottom: 8px; display: block; color: #444; font-size: 0.9rem; }
            .input-with-icon { position: relative; display: flex; align-items: center; }
            .input-with-icon i { position: absolute; left: 15px; color: #a29bfe; z-index: 2; }
            .input-with-icon .ui-inputfield { padding-left: 40px !important; border-radius: 10px !important; border: 1.5px solid #eee !important; }
            .modern-select { border-radius: 10px !important; border: 1.5px solid #eee !important; }
            .button-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f0f0f0; }
            .modern-save-btn { background: #6c5ce7 !important; border: none !important; border-radius: 8px !important; padding: 5px 20px !important; }
            .modern-cancel-btn { color: #888 !important; }
        </style>
    </h:head>
    <h:body>
        <p:growl id="growl" showDetail="true" />

        <div class="dashboard-container">
            <aside class="sidebar">
                <div class="logo">
                    <i class="fas fa-shield-halved"></i>
                    <span>Smart Attendance</span>
                </div>
                <nav class="menu">
                    <h:link outcome="admin_dashboard.xhtml" styleClass="active"><i class="fas fa-chart-line"></i> Dashboard</h:link>
                <h:link outcome="manage_faculty.xhtml"><i class="fas fa-chalkboard-teacher"></i> Manage Faculty</h:link>
                <h:link outcome="manage_students.xhtml"><i class="fas fa-user-graduate"></i> Manage Students</h:link>
                <h:link outcome="manage_subjects.xhtml"><i class="fas fa-book"></i> Subjects</h:link>
                <h:link outcome="view_reports.xhtml"><i class="fas fa-file-invoice"></i> Attendance Reports</h:link>
                <h:form>
                    <p:commandLink action="#{authBean.logout()}" styleClass="logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </p:commandLink>
                </h:form>
                </nav>
            </aside>

            <main class="main-content">
                <header class="top-nav" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2>Subject Management</h2>
                        <p style="color: var(--lilac-soft);">Manage academic subjects and courses</p>
                    </div>
                    <h:form id="headerActionForm">
                        <p:commandButton value="Add New Subject" icon="pi pi-plus" 
                                         type="button"
                                         onclick="PF('addSubjectDlg').show();" 
                                         styleClass="ui-button-raised ui-button-help premium-btn" />
                    </h:form>
                </header>

                <div class="stat-card" style="background: var(--glass-bg); padding: 30px; margin-top: 20px; min-height: 400px;">
                    <h:form id="subjectForm">
                        <p:dataTable id="dt-subjects" value="#{subjectClient.subjectList}" var="subject" 
                                     paginator="true" rows="8" paginatorPosition="bottom"
                                     reflow="true" styleClass="products-table"
                                     emptyMessage="No subjects found.">

                            <p:column headerText="Code">
                                <span class="badge-code" style="background: var(--lilac-light); padding: 5px 10px; border-radius: 8px;">
                                    #{subject.subjectCode}
                                </span>
                            </p:column>

                            <p:column headerText="Subject Name">
                                <h:outputText value="#{subject.subjectName}" style="font-weight: 600; color: var(--lilac-dark);" />
                            </p:column>

                            <p:column headerText="Semester">
                                <h:outputText value="#{subject.semesterId.semesterNo}" />
                            </p:column>

                            <p:column headerText="Actions">
                                <p:commandButton icon="pi pi-pencil" styleClass="ui-button-flat" style="color: var(--lilac-medium);" />
                                <p:commandButton icon="pi pi-trash" styleClass="ui-button-flat" style="color: #ff5252;" />
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </div>
            </main>
        </div>

        <p:dialog header="Create New Subject" 
                  widgetVar="addSubjectDlg" 
                  modal="true" 
                  resizable="false"
                  draggable="false"
                  responsive="true" 
                  showEffect="fade"
                  hideEffect="fade"
                  styleClass="modern-dialog" 
                  width="450"
                  appendTo="@(body)">

            <h:form id="addForm">
                <div class="ui-fluid modern-form-container">
                    <div style="text-align: center; margin-bottom: 25px;">
                        <div class="dialog-icon-circle">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <p style="color: #666; font-size: 0.85rem; margin-top: 10px; font-family: 'Poppins';">
                            Enter details to register a new academic subject
                        </p>
                    </div>

                    <p:outputPanel id="subject-content">
                        <div class="field-wrapper">
                            <p:outputLabel for="name" value="Subject Name" styleClass="modern-label" />
                            <div class="input-with-icon">
                                <i class="fas fa-pen-nib"></i>
                                <p:inputText id="name" value="#{subjectClient.subjectName}" 
                                             required="true" placeholder="e.g. Machine Learning" />
                            </div>
                        </div>

                        <div class="field-wrapper">
                            <p:outputLabel for="code" value="Subject Code" styleClass="modern-label" />
                            <div class="input-with-icon">
                                <i class="fas fa-barcode"></i>
                                <p:inputText id="code" value="#{subjectClient.subjectCode}" 
                                             required="true" placeholder="e.g. CS-401" />
                            </div>
                        </div>

                        <div class="field-wrapper">
                            <p:outputLabel for="sem" value="Select Semester" styleClass="modern-label" />
                            <p:selectOneMenu id="sem" value="#{subjectClient.semesterId}" required="true" styleClass="modern-select">
                                <f:selectItem itemLabel="Choose Semester..." itemValue="" noSelectionOption="true" />
                                <f:selectItems value="#{subjectClient.allSemesters}" var="s" 
                                               itemLabel="#{s.semesterNo}" itemValue="#{s.id}" />
                            </p:selectOneMenu>
                        </div>

                        <div class="button-footer">
                            <p:commandButton value="Cancel" type="button" 
                                             onclick="PF('addSubjectDlg').hide();" 
                                             styleClass="ui-button-flat modern-cancel-btn" />

                            <p:commandButton value="Save Subject" 
                                             action="#{subjectClient.addSubject()}" 
                                             update=":subjectForm:dt-subjects :growl @form" 
                                             oncomplete="if (!args.validationFailed) PF('addSubjectDlg').hide();"
                                             styleClass="modern-save-btn" 
                                             icon="pi pi-check" />
                        </div>
                    </p:outputPanel>
                </div>
            </h:form>
        </p:dialog>
    </h:body>
</html>
